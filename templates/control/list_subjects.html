{% extends 'base.html' %}
{% block body %}
<div class="wrap">
    <h1>Subjects</h1>
    <form method="get" style="display:flex;gap:8px;margin-bottom:10px;">
        <input type="search" name="q" value="{{ q or '' }}" placeholder="Search">
        <button class="btn" type="submit">Search</button>
    </form>
    <p><a class="btn" href="/control/add_subject">Add subject</a></p>
    <table>
        <tr><th>ID</th><th>Code</th><th>Name</th><th>Summary</th><th>Weeks</th><th>State</th><th></th></tr>
        {% for row in rows %}
        <tr>
            <td>{{ row.id }}</td><td>{{ row.code }}</td><td>{{ row.name }}</td>
            <td>{{ row.summary }}</td><td>{{ row.weeks }}</td><td>{{ row.state }}</td>
            <td><a href="/control/edit_subject/{{ row.id }}">Edit</a> <a href="/control/drop_subject/{{ row.id }}">Drop</a></td>
        </tr>
        {% else %}<tr><td colspan="7">None</td></tr>{% endfor %}
    </table>
</div>
{% endblock %}
