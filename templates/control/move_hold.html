{% extends 'base.html' %}
{% block body %}
<form class="form-wrap" method="post">
    <h1>Move hold</h1>
    <p>Exam: {{ exam.name }}</p>
    {% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
    <label>New slot</label>
    <select name="slot_id" required>
        {% for s in slots %}
        <option value="{{ s.id }}" {% if s.id==hold.slot_id %}selected{% endif %}>
            {{ s.day }} {{ s.start_clock }} - {{ s.end_clock }} (cap {{ s.capacity }})
        </option>
        {% endfor %}
    </select>
    <button class="btn" type="submit">Save</button>
    <p><a href="/control/list_holds">Back</a></p>
</form>
{% endblock %}
