{% extends 'base.html' %}
{% block body %}
<form class="form-wrap" method="post">
    <h1>Add subject</h1>
    <label>Code</label><input name="code" required>
    <label>Name</label><input name="name" required>
    <label>Summary</label><input name="summary" required>
    <label>Weeks</label><input name="weeks" required>
    <label>State</label>
    <select name="state"><option>Active</option><option>Inactive</option></select>
    <button class="btn" type="submit">Save</button>
</form>
{% endblock %}
