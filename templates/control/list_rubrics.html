{% extends 'base.html' %}
{% block body %}
<div class="wrap">
    <h1>Rubric lines</h1>
    <p><a class="btn" href="/control/add_rubric/{{ aid }}">Add line</a></p>
    <table>
        <tr><th>ID</th><th>Label</th><th>Max</th><th>Weight</th><th>Note</th><th></th></tr>
        {% for line in lines %}
        <tr>
            <td>{{ line.id }}</td><td>{{ line.label }}</td><td>{{ line.max_points }}</td>
            <td>{{ line.weight }}</td><td>{{ line.note }}</td>
            <td><a href="/control/edit_rubric/{{ line.id }}">Edit</a> <a href="/control/drop_rubric/{{ line.id }}">Drop</a></td>
        </tr>
        {% else %}<tr><td colspan="6">None</td></tr>{% endfor %}
    </table>
</div>
{% endblock %}
