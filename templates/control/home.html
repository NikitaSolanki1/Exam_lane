{% extends 'base.html' %}
{% block body %}
<div class="wrap">
    <h1>Admin panel</h1>
    <div class="counts">
        <div class="count"><b>{{ n_subject }}</b>Subjects</div>
        <div class="count"><b>{{ n_assessment }}</b>Assessments</div>
        <div class="count"><b>{{ n_learner }}</b>Learners</div>
        <div class="count"><b>{{ n_marker }}</b>Markers</div>
        <div class="count"><b>{{ n_slot }}</b>Slots</div>
        <div class="count"><b>{{ n_hold }}</b>Holds</div>
    </div>
    <p>
        <a class="btn" href="/control/add_subject">Add subject</a>
        <a class="btn" href="/control/add_assessment">Add assessment</a>
        <a class="btn" href="/control/list_markers">Verify markers</a>
        <a class="btn" href="/control/list_holds">View holds</a>
        <a class="btn" href="/control/list_slots">View slots</a>
    </p>
</div>
{% endblock %}
