{% extends 'base.html' %}
{% block body %}
<form class="form-wrap" method="post">
    <h1>Edit rubric line</h1>
    <label>Label</label><input name="label" value="{{ line.label }}" required>
    <label>Max points</label><input type="number" name="max_points" value="{{ line.max_points }}" min="1" required>
    <label>Weight</label><input type="number" step="0.1" name="weight" value="{{ line.weight }}">
    <label>Note</label><input name="note" value="{{ line.note }}">
    <button class="btn" type="submit">Save</button>
</form>
{% endblock %}
