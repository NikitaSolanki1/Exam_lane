{% extends 'base.html' %}
{% block content %}
<form class="card-form" action="/student_routes/create_profile" method="post">
    <h1>Student profile</h1>
    <label for="full_name">Full name</label>
    <input type="text" name="full_name" id="full_name" value="{{ user.full_name }}" required>
    <label for="email">Email</label>
    <input type="email" name="email" id="email" value="{{ user.email }}" required>
    <label for="registration_number">Registration number</label>
    <input type="text" name="registration_number" id="registration_number" value="{{ pf.registration_number if pf else '' }}" required>
    <label for="contact_number">Contact number</label>
    <input type="text" name="contact_number" id="contact_number" value="{{ pf.contact_number if pf else '' }}" required>
    <label for="residential_address">Address</label>
    <input type="text" name="residential_address" id="residential_address" value="{{ pf.residential_address if pf else '' }}" required>
    <label for="academic_year">Academic year</label>
    <input type="text" name="academic_year" id="academic_year" value="{{ pf.academic_year if pf else '' }}" required>
    <button type="submit">Save profile</button>
</form>
{% endblock %}
