{% extends 'base.html' %}
{% block content %}
<form class="card-form" action="/admin_routes/create_rubric/{{ id }}" method="post">
    <h1>Add rubric item</h1>
    <label for="criterion">Criterion</label>
    <input type="text" name="criterion" id="criterion" required>
    <label for="max_score">Maximum marks</label>
    <input type="number" name="max_score" id="max_score" min="1" required>
    <label for="weightage">Weightage</label>
    <input type="number" step="0.1" name="weightage" id="weightage" value="1.0">
    <label for="description">Description</label>
    <input type="text" name="description" id="description">
    <button type="submit">Save item</button>
</form>
{% endblock %}
