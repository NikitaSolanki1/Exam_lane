{% extends 'base.html' %}
{% block content %}
<form class="card-form" action="/admin_routes/create_course" method="post">
    <h1>New course</h1>
    <label for="course_code">Course code</label>
    <input type="text" name="course_code" id="course_code" required>
    <label for="title">Course name</label>
    <input type="text" name="title" id="title" required>
    <label for="description">Description</label>
    <input type="text" name="description" id="description" required>
    <label for="duration_weeks">Duration (weeks)</label>
    <input type="text" name="duration_weeks" id="duration_weeks" required>
    <label for="status">Status</label>
    <select name="status" id="status">
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
    </select>
    <button type="submit">Save course</button>
</form>
{% endblock %}
