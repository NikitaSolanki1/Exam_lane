{% extends 'base.html' %}
{% block content %}
<form class="card-form" action="/auth/login" method="post">
    <h1>Sign in</h1>
    <p class="lead">Enter your email and password to open your desk.</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <button type="submit">Continue</button>
    <p style="margin-top:16px;text-align:center;">New here? <a href="/auth/register">Register on ExamLane</a></p>
</form>
{% endblock %}
