{% extends 'base.html' %}
{% block body %}
<form class="form-wrap" method="post">
    <h1>Learner bio</h1>
    <label>Display name</label><input name="display_name" value="{{ person.display_name }}" required>
    <label>Email</label><input type="email" name="email" value="{{ person.email }}" required>
    <label>Roll no</label><input name="roll_no" value="{{ bio.roll_no if bio else '' }}" required>
    <label>Phone</label><input name="phone" value="{{ bio.phone if bio else '' }}" required>
    <label>Address</label><input name="home_address" value="{{ bio.home_address if bio else '' }}" required>
    <label>Batch year</label><input name="batch_year" value="{{ bio.batch_year if bio else '' }}" required>
    <button class="btn" type="submit">Save</button>
</form>
{% endblock %}
